stages:
  - build
  - deploy

variables:
  VITE_API_BASE_URL: "https://immo360-api-gateway.onrender.com/api"
  NPM_CONFIG_PROGRESS: false
  CI: true

# Mise en cache pour accélérer les builds suivants
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
    - .npm

# Étape Build
build:
  stage: build
  tags:
    - web
  image: node:20-bullseye
  script:
    - echo "🔧 Configuration de l'environnement de production..."
    - echo "VITE_API_BASE_URL=$VITE_API_BASE_URL" > .env.production
    - echo "📦 Installation des dépendances..."
    - npm ci
    - echo "🏗️ Build du projet React..."
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  only:
    - main
    - develop
    - web
    - /^release\/.*$/

# Étape Déploiement sur GitLab Pages
pages:
  stage: deploy
  tags:
    - web
  image: node:20-bullseye
  dependencies:
    - build
  script:
    - echo "📦 Déploiement sur GitLab Pages..."
    - rm -rf public || true
    - mv dist public
  artifacts:
    paths:
      - public
    expire_in: 1 week
  only:
    - main
    - web
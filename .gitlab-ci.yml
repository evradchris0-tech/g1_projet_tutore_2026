# ==================== PIPELINE CONFIGURATION ====================
# Pipeline GitLab CI/CD pour Frontend React/Vite optimisé

variables:
  NODE_VERSION: "20"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"
  NPM_CONFIG_PROGRESS: "false"
  VITE_API_BASE_URL: "https://immo360-api-gateway.onrender.com/api"
  CI: "true"
  RENDER_PRODUCTION_URL: "https://g1-projet-tutore-frontend.onrender.com"
  RENDER_STAGING_URL: "https://g1-projet-tutore-frontend-staging.onrender.com"

# ==================== CACHE OPTIMISÉ ====================
# cache séparé pour npm et node_modules
.cache_node: &cache_node
  key:
    files:
      - package-lock.json
    prefix: ${CI_COMMIT_REF_SLUG}-${NODE_VERSION}
  paths:
    - .npm
    - node_modules
  policy: pull-push

# ==================== TEMPLATES ====================
.node_job: &node_job
  image: node:${NODE_VERSION}-alpine
  before_script:
    - echo "📦 Restauration du cache et installation rapide..."
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund
  cache:
    <<: *cache_node

.build_template: &build_template
  stage: build
  <<: *node_job
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

# ==================== STAGES ====================
stages:
  - install
  - quality
  - security
  - test
  - build
  - deploy
  - cleanup

# ==================== INSTALL ====================
install_dependencies:
  stage: install
  <<: *node_job
  script:
    - echo "📥 Installation des dépendances (optimisée par cache)"
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour

# ==================== QUALITY ====================
lint:
  stage: quality
  <<: *node_job
  needs:
    - job: install_dependencies
      artifacts: true
  script:
    - echo "🔍 Vérification de la qualité du code..."
    - npm run lint
  allow_failure: false

format_check:
  stage: quality
  <<: *node_job
  needs:
    - install_dependencies
  script:
    - npm run format:check
  allow_failure: true

type_check:
  stage: quality
  <<: *node_job
  needs:
    - install_dependencies
  script:
    - npm run type-check || echo "⚠️ Type check ignoré (erreurs ignorées)"
  allow_failure: true

# ==================== SECURITY ====================
security_audit:
  stage: security
  <<: *node_job
  needs: install_dependencies
  script:
    - npm audit --audit-level=moderate || true
  allow_failure: true

dependency_check:
  stage: security
  <<: *node_job
  needs: install_dependencies
  script:
    - npm outdated || true
  allow_failure: true

# ==================== TEST ====================
unit_tests:
  stage: test
  <<: *node_job
  needs: install_dependencies
  script:
    - npm run test:unit
  artifacts:
    when: always
    paths:
      - coverage/
    reports:
      junit: coverage/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    expire_in: 7d

integration_tests:
  stage: test
  <<: *node_job
  needs: install_dependencies
  script:
    - npm run test:integration || echo "⚠️ Tests d'intégration ignorés"
  allow_failure: true

# ==================== BUILD ====================
build_production:
  <<: *build_template
  needs: install_dependencies
  before_script:
    - echo "🏗️ Build PROD..."
    - echo "VITE_API_BASE_URL=$VITE_API_BASE_URL" > .env.production
    - echo "VITE_ENV=production" >> .env.production
  script:
    - npm run build
  artifacts:
    name: "production-build-${CI_COMMIT_SHORT_SHA}"
    paths:
      - dist/
    expire_in: 1 month
  only:
    - web

build_staging:
  <<: *build_template
  needs: install_dependencies
  before_script:
    - echo "🏗️ Build STAGING..."
    - echo "VITE_API_BASE_URL=$VITE_API_BASE_URL" > .env.production
    - echo "VITE_ENV=staging" >> .env.production
  script:
    - npm run build
  artifacts:
    name: "staging-build-${CI_COMMIT_SHORT_SHA}"
    paths:
      - dist/
    expire_in: 1 week
  only:
    - develop

# ==================== DEPLOY ====================
.deploy_render: &deploy_render
  stage: deploy
  image: curlimages/curl:latest
  script:
    - echo "🚀 Déploiement..."
  retry:
    max: 2

deploy_production:
  <<: *deploy_render
  needs: build_production
  script:
    - |
      if [ -z "$RENDER_DEPLOY_HOOK_PRODUCTION" ]; then exit 1; fi
      curl -s -X POST "$RENDER_DEPLOY_HOOK_PRODUCTION"
  environment:
    name: production
    url: $RENDER_PRODUCTION_URL
  only:
    - web
  when: manual

deploy_staging:
  <<: *deploy_render
  needs: build_staging
  script:
    - |
      if [ -z "$RENDER_DEPLOY_HOOK_STAGING" ]; then exit 1; fi
      curl -s -X POST "$RENDER_DEPLOY_HOOK_STAGING"
  environment:
    name: staging
    url: $RENDER_STAGING_URL
  only:
    - develop
  when: on_success

# ==================== CLEANUP ====================
cleanup_preview:
  stage: cleanup
  image: curlimages/curl:latest
  script:
    - echo "🧹 Nettoyage preview MR !${CI_MERGE_REQUEST_IID}"
  environment:
    name: preview/mr-$CI_MERGE_REQUEST_IID
    action: stop
  when: manual
  only:
    - merge_requests

# ==================== WORKFLOW ====================
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
    - if: '$CI_COMMIT_BRANCH == "web"'
      when: always
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: always
    - if: '$CI_COMMIT_TAG'
      when: always
    - when: never

stages:
  - build
  - deploy

variables:
  NODE_ENV: "production"
  VITE_API_BASE_URL: "https://immo360-api-gateway.onrender.com/api"

build:
  stage: build
  tags:
    - web
  image: node:20-bullseye
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
  script:
    - echo "🔧 Configuration de l'environnement de production..."
    - echo VITE_API_BASE_URL=$VITE_API_BASE_URL > .env.production
    - echo "📦 Installation des dépendances..."
    - npm ci
    - echo "🏗️ Build du projet React..."
    - npx vite build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  only:
    - main
    - develop
    - web
    - /^release\/.*$/

pages:
  stage: deploy
  tags:
    - web
  dependencies:
    - build
  script:
    - echo "📦 Déploiement sur GitLab Pages..."
    - rm -rf public || true
    - mv dist public
  artifacts:
    paths:
      - public
    expire_in: 1 week
  only:
    - main
    - web

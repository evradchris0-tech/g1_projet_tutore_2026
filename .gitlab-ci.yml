# ==================== CACHE GLOBAL LÉGER ====================
.cache_global: &cache_global
  key:
    files:
      - api-gateway/package-lock.json
      - auth-service/package-lock.json
  paths:
    - .npm
  policy: pull-push

# ==================== CONFIGURATION RUNNER ====================
default:
  tags:
    - backend
  cache:
    <<: *cache_global

# ==================== VARIABLES ====================
variables:
  NODE_ENV: test
  PORT_AUTH: "3001"
  PORT_GATEWAY: "3000"
  JWT_SECRET: test_jwt_secret_for_ci
  IMAGE_API_GATEWAY: "registry.gitlab.com/g1_projet_tutore_2026/g1_projet_tutore_2026:api-gateway"
  IMAGE_AUTH_SERVICE: "registry.gitlab.com/g1_projet_tutore_2026/g1_projet_tutore_2026:auth-service"

# ==================== STAGES ====================
stages:
  - install
  - lint
  - test
  - deploy_staging

# ==================== INSTALL ====================
install_api_gateway:
  stage: install
  image: $IMAGE_API_GATEWAY
  script:
    - echo "API Gateway dependencies are already in the Docker image."
  cache:
    <<: *cache_global
  artifacts:
    paths:
      - api-gateway/node_modules
    expire_in: 1h

install_auth_service:
  stage: install
  image: $IMAGE_AUTH_SERVICE
  script:
    - echo "Auth Service dependencies are already in the Docker image."
  cache:
    <<: *cache_global
  artifacts:
    paths:
      - auth-service/node_modules
    expire_in: 1h

# ==================== LINT ====================
lint_api_gateway:
  stage: lint
  image: $IMAGE_API_GATEWAY
  script:
    - npm run lint

lint_auth_service:
  stage: lint
  image: $IMAGE_AUTH_SERVICE
  script:
    - npm run lint

# ==================== TEST ====================
test_api_gateway:
  stage: test
  image: $IMAGE_API_GATEWAY
  script:
    - npm run test:cov
  artifacts:
    paths:
      - api-gateway/coverage/cobertura-coverage.xml
    expire_in: 7d
    reports:
      coverage_report:
        coverage_format: cobertura
        path: api-gateway/coverage/cobertura-coverage.xml

test_auth_service:
  stage: test
  image: $IMAGE_AUTH_SERVICE
  script:
    - npm run test:cov
  artifacts:
    paths:
      - auth-service/coverage/cobertura-coverage.xml
    expire_in: 7d
    reports:
      coverage_report:
        coverage_format: cobertura
        path: auth-service/coverage/cobertura-coverage.xml

# ==================== DEPLOY STAGING ====================
deploy_staging:
  stage: deploy_staging
  tags:
    - backend
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    # Pull des images testées et buildées
    - docker pull $IMAGE_API_GATEWAY
    - docker pull $IMAGE_AUTH_SERVICE

    # Déploiement sur le serveur staging via SSH
    - ssh $STAGING_USER@$STAGING_SERVER "
        docker stop api-gateway || true
        docker rm api-gateway || true
        docker run -d --name api-gateway -p $PORT_GATEWAY:3000 $IMAGE_API_GATEWAY

        docker stop auth-service || true
        docker rm auth-service || true
        docker run -d --name auth-service -p $PORT_AUTH:3001 $IMAGE_AUTH_SERVICE
      "
  environment:
    name: staging
    url: https://staging-api.immo360.com
  only:
    - develop
  when: manual

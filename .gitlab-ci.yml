stages:
  - build
  - deploy

variables:
  NODE_ENV: "production"
  VITE_API_BASE_URL: "https://immo360-api-gateway.onrender.com/api"

build:
  stage: build
  tags:
    - web
  before_script:
    - Write-Host "🔧 Vérification de Node.js..."
    - if (Get-Command node -ErrorAction SilentlyContinue) { node --version } else { Write-Host "Node.js non trouvé" }
    - if (!(Get-Command node -ErrorAction SilentlyContinue)) {
        Write-Host '📥 Installation de Node.js via winget...'
        winget install OpenJS.NodeJS.LTS --silent
      }
    - Write-Host "📦 Installation des dépendances..."
    - npm install
    - Write-Host "📦 Installation des dépendances..."
    - npm ci

  script:
    - Write-Host "🔧 Configuration de l'environnement de production..."
    - "echo VITE_API_BASE_URL=$VITE_API_BASE_URL > .env.production"
    - Write-Host "🏗️ Build du projet React..."
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  only:
    - main
    - develop
    - web
    - /^release\/.*$/

pages:
  stage: deploy
  tags:
    - web
  dependencies:
    - build
  script:
    - if (Test-Path public) { Remove-Item -Recurse -Force public }
    - Move-Item dist public
  artifacts:
    paths:
      - public
    expire_in: 1 week
  only:
    - main
    - web

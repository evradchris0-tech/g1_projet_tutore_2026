# ==================== CACHE GLOBAL ====================
.cache_global: &cache_global
  key:
    files:
      - api-gateway/package-lock.json
      - auth-service/package-lock.json
  paths:
    - .npm
  policy: pull-push

# ==================== DEFAULT RUNNER ====================
default:
  tags:
    - backend
  image: node:20-alpine
  cache:
    <<: *cache_global

# ==================== VARIABLES ====================
variables:
  NODE_ENV: test
  PORT_AUTH: "3001"
  PORT_GATEWAY: "3000"
  JWT_SECRET: test_jwt_secret_for_ci

# ==================== STAGES ====================
stages:
  - install
  - lint
  - test
  - build
  - deploy_staging

# ==================== INSTALL ====================
install_api_gateway:
  stage: install
  script:
    - cd api-gateway && npm ci --prefer-offline --no-audit
  cache:
    <<: *cache_global
  artifacts:
    paths:
      - api-gateway/node_modules
    expire_in: 1h

install_auth_service:
  stage: install
  script:
    - cd auth-service && npm ci --prefer-offline --no-audit
  cache:
    <<: *cache_global
  artifacts:
    paths:
      - auth-service/node_modules
    expire_in: 1h

# ==================== LINT ====================
lint_api_gateway:
  stage: lint
  dependencies:
    - install_api_gateway
  script:
    - cd api-gateway
    - npm run lint

lint_auth_service:
  stage: lint
  dependencies:
    - install_auth_service
  script:
    - cd auth-service
    - npm run lint

# ==================== TEST ====================
test_api_gateway:
  stage: test
  dependencies:
    - install_api_gateway
  script:
    - cd api-gateway
    - npm run test:cov
  artifacts:
    paths:
      - api-gateway/coverage/cobertura-coverage.xml
    expire_in: 7d
    reports:
      coverage_report:
        coverage_format: cobertura
        path: api-gateway/coverage/cobertura-coverage.xml

test_auth_service:
  stage: test
  dependencies:
    - install_auth_service
  script:
    - cd auth-service
    - npm run test:cov
  artifacts:
    paths:
      - auth-service/coverage/cobertura-coverage.xml
    expire_in: 7d
    reports:
      coverage_report:
        coverage_format: cobertura
        path: auth-service/coverage/cobertura-coverage.xml

# ==================== BUILD ====================
build_api_gateway:
  stage: build
  dependencies:
    - install_api_gateway
  script:
    - cd api-gateway && npm run build
  artifacts:
    paths:
      - api-gateway/dist/
    expire_in: 1d

build_auth_service:
  stage: build
  dependencies:
    - install_auth_service
  script:
    - cd auth-service && npm run build
  artifacts:
    paths:
      - auth-service/dist/
    expire_in: 1d

# ==================== DEPLOY STAGING ====================
deploy_staging:
  stage: deploy_staging
  tags:
    - backend
  image: registry.gitlab.com/g1_projet_tutore_2026/g1_projet_tutore_2026:api-gateway
  dependencies:
    - build_api_gateway
    - build_auth_service
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H $STAGING_SERVER >> ~/.ssh/known_hosts
  script: |
      # Créer un dossier temporaire sur le serveur pour recevoir les artifacts
      ssh -o StrictHostKeyChecking=no $STAGING_USER@$STAGING_SERVER "mkdir -p /var/www/immo360-backend/tmp_deploy"
      
      # Copier les artifacts buildés
      scp -r api-gateway/dist $STAGING_USER@$STAGING_SERVER:/var/www/immo360-backend/tmp_deploy/api-gateway
      scp -r auth-service/dist $STAGING_USER@$STAGING_SERVER:/var/www/immo360-backend/tmp_deploy/auth-service

      # Déplacer les builds dans le dossier final et redémarrer pm2
      ssh -o StrictHostKeyChecking=no $STAGING_USER@$STAGING_SERVER "
        mv /var/www/immo360-backend/tmp_deploy/api-gateway/* /var/www/immo360-backend/api-gateway/
        mv /var/www/immo360-backend/tmp_deploy/auth-service/* /var/www/immo360-backend/auth-service/
        rm -rf /var/www/immo360-backend/tmp_deploy
        pm2 restart api-gateway
        pm2 restart auth-service
        echo 'Déploiement staging terminé avec succès !'
      "
  environment:
    name: staging
    url: https://staging-api.immo360.com
  only:
    - develop
  when: manual

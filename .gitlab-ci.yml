# Pipeline CI/CD Backend - IMMO360 (Optimisé pour votre runner Windows)
default:
  tags:
    - backend
    - microservice
    - testing
    - authentification
    - CI/CD
    - code-review

image: node:20-alpine

# ==================== CACHE ====================
cache:
  key:
    files:
      - api-gateway/package-lock.json
      - auth-service/package-lock.json
      - building-service/package-lock.json
  paths:
    - api-gateway/node_modules/
    - auth-service/node_modules/
    - building-service/node_modules/
    - .npm/
  policy: pull-push

variables:
  NODE_ENV: test
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: postgres
  DB_PASS: testpassword
  DB_NAME: immo360_test
  JWT_SECRET: test_jwt_secret_for_ci
  PORT_AUTH: "3001"
  PORT_GATEWAY: "3000"

services:
  - name: postgres:15-alpine
    alias: postgres
    variables:
      POSTGRES_DB: immo360_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: testpassword

# ==================== STAGES ====================
stages:
  - install
  - test
  - build

# ==================== INSTALL ====================
install_dependencies:
  stage: install
  script:
    - echo "🚀 Installation optimisée des dépendances..."
    - apk add --no-cache python3 make g++
    - cd api-gateway && npm ci --cache .npm --prefer-offline --no-audit
    - cd ../auth-service && npm ci --cache .npm --prefer-offline --no-audit
    - cd ../building-service && npm ci --cache .npm --prefer-offline --no-audit
  artifacts:
    paths:
      - api-gateway/node_modules/
      - auth-service/node_modules/
      - building-service/node_modules/
    expire_in: 1h

# ==================== TEST ====================
test_services:
  stage: test
  dependencies:
    - install_dependencies
  script:
    - echo "🧪 Exécution des tests backend..."
    - cd auth-service && npm run test -- --passWithNoTests
    - cd ../building-service && npm run test -- --passWithNoTests
  artifacts:
    when: always
    paths:
      - auth-service/coverage/
      - building-service/coverage/
    expire_in: 7d

# ==================== BUILD ====================
build_services:
  stage: build
  dependencies:
    - install_dependencies
  script:
    - echo "🏗 Construction des services backend..."
    - cd api-gateway && npm run build
    - cd ../auth-service && npm run build
    - cd ../building-service && npm run build
  artifacts:
    paths:
      - api-gateway/dist/
      - auth-service/dist/
      - building-service/dist/
    expire_in: 1d
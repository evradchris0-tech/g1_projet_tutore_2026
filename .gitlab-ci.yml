# ==================== VARIABLES ====================
variables:
  NODE_ENV: test
  PORT_AUTH: "3001"
  PORT_GATEWAY: "3000"
  JWT_SECRET: test_jwt_secret_for_ci
  DOCKER_REGISTRY: registry.gitlab.com
  DOCKER_IMAGE: $DOCKER_REGISTRY/g1_projet_tutore_2026/g1_projet_tutore_2026

# ==================== STAGES ====================
stages:
  - lint
  - test
  - build
  - deploy_staging

# ==================== LINT ====================
lint_api_gateway:
  stage: lint
  image: node:20-alpine
  script:
    - cd api-gateway
    - npm ci --prefer-offline --no-audit
    - npm run lint

lint_auth_service:
  stage: lint
  image: node:20-alpine
  script:
    - cd auth-service
    - npm ci --prefer-offline --no-audit
    - npm run lint

# ==================== TEST ====================
test_api_gateway:
  stage: test
  image: node:20-alpine
  script:
    - cd api-gateway
    - npm ci --prefer-offline --no-audit
    - npm run test:cov
  artifacts:
    reports:
      cobertura: api-gateway/coverage/cobertura-coverage.xml

test_auth_service:
  stage: test
  image: node:20-alpine
  script:
    - cd auth-service
    - npm ci --prefer-offline --no-audit
    - npm run test:cov
  artifacts:
    reports:
      cobertura: auth-service/coverage/cobertura-coverage.xml

# ==================== BUILD IMAGES ====================
build_api_gateway:
  stage: build
  image: docker:24-dind
  services:
    - docker:24-dind
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $DOCKER_REGISTRY
    - docker build -t $DOCKER_IMAGE:api-gateway --build-arg SERVICE_NAME=api-gateway .
    - docker push $DOCKER_IMAGE:api-gateway

build_auth_service:
  stage: build
  image: docker:24-dind
  services:
    - docker:24-dind
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $DOCKER_REGISTRY
    - docker build -t $DOCKER_IMAGE:auth-service --build-arg SERVICE_NAME=auth-service .
    - docker push $DOCKER_IMAGE:auth-service

# ==================== DEPLOY STAGING ====================
deploy_staging:
  stage: deploy_staging
  image: alpine:latest
  tags:
    - backend
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H $STAGING_SERVER >> ~/.ssh/known_hosts
  script: |
    ssh -o StrictHostKeyChecking=no $STAGING_USER@$STAGING_SERVER "
      docker pull $DOCKER_IMAGE:api-gateway &&
      docker pull $DOCKER_IMAGE:auth-service &&
      docker stop api-gateway || true &&
      docker rm api-gateway || true &&
      docker run -d --name api-gateway -p $PORT_GATEWAY:3000 $DOCKER_IMAGE:api-gateway &&
      docker stop auth-service || true &&
      docker rm auth-service || true &&
      docker run -d --name auth-service -p $PORT_AUTH:3001 $DOCKER_IMAGE:auth-service
    "
  environment:
    name: staging
    url: https://staging-api.immo360.com
  only:
    - develop
  when: manual
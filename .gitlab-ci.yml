# Pipeline CI/CD Backend - IMMO360
# Déclenché automatiquement sur Merge Requests vers develop

image: node:20-alpine

cache:
  key:
    files:
      - api-gateway/package-lock.json
      - auth-service/package-lock.json
  paths:
    - api-gateway/node_modules/
    - auth-service/node_modules/

variables:
  NODE_ENV: test
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: postgres
  DB_PASS: testpassword
  DB_NAME: immo360_test
  JWT_SECRET: test_jwt_secret_for_ci
  PORT_AUTH: "3001"
  PORT_GATEWAY: "3000"

services:
  - name: postgres:15-alpine
    alias: postgres
    variables:
      POSTGRES_DB: immo360_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: testpassword

stages:
  - install
  - lint
  - test
  - build
  - deploy_staging

# ==================== STAGE: INSTALL ====================
install_dependencies:
  stage: install
  script:
    - echo " Installation des dépendances backend..."
    - cd api-gateway && npm ci
    - cd ../auth-service && npm ci
  artifacts:
    paths:
      - api-gateway/node_modules/
      - auth-service/node_modules/
    expire_in: 1 hour
  only:
    - merge_requests
    - develop
  tags:
    - docker

# ==================== STAGE: LINT ====================
lint_api_gateway:
  stage: lint
  dependencies:
    - install_dependencies
  script:
    - echo " Lint API Gateway..."
    - cd api-gateway
    - npm run lint
  only:
    - merge_requests
    - develop
  tags:
    - docker
  allow_failure: false

lint_auth_service:
  stage: lint
  dependencies:
    - install_dependencies
  script:
    - echo " Lint Auth Service..."
    - cd auth-service
    - npm run lint
  only:
    - merge_requests
    - develop
  tags:
    - docker
  allow_failure: false

# ==================== STAGE: TEST ====================
test_api_gateway:
  stage: test
  dependencies:
    - install_dependencies
  script:
    - echo " Tests unitaires API Gateway..."
    - cd api-gateway
    - npm run test
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: api-gateway/coverage/cobertura-coverage.xml
    paths:
      - api-gateway/coverage/
    expire_in: 7 days
  only:
    - merge_requests
    - develop
  tags:
    - docker

test_auth_service:
  stage: test
  dependencies:
    - install_dependencies
  services:
    - postgres:15-alpine
  script:
    - echo "🧪 Tests unitaires Auth Service..."
    - cd auth-service
    - npm run test
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: auth-service/coverage/cobertura-coverage.xml
    paths:
      - auth-service/coverage/
    expire_in: 7 days
  only:
    - merge_requests
    - develop
  tags:
    - docker

# ==================== STAGE: BUILD ====================
build_api_gateway:
  stage: build
  dependencies:
    - install_dependencies
  script:
    - echo "🏗️  Build API Gateway..."
    - cd api-gateway
    - npm run build
  artifacts:
    paths:
      - api-gateway/dist/
    expire_in: 1 day
  only:
    - merge_requests
    - develop
  tags:
    - docker

build_auth_service:
  stage: build
  dependencies:
    - install_dependencies
  script:
    - echo "🏗️  Build Auth Service..."
    - cd auth-service
    - npm run build
  artifacts:
    paths:
      - auth-service/dist/
    expire_in: 1 day
  only:
    - merge_requests
    - develop
  tags:
    - docker

# ==================== STAGE: DEPLOY STAGING ====================
deploy_staging:
  stage: deploy_staging
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client rsync
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H $STAGING_SERVER >> ~/.ssh/known_hosts
  script:
    - echo " Déploiement sur staging..."
    - |
      ssh $STAGING_USER@$STAGING_SERVER << 'EOF'
        cd /var/www/immo360-backend
        git pull origin develop
        cd api-gateway && npm ci && npm run build && pm2 restart api-gateway
        cd ../auth-service && npm ci && npm run build && pm2 restart auth-service
        echo " Déploiement staging terminé!"
      EOF
  environment:
    name: staging
    url: https://staging-api.immo360.com
  only:
    - develop
  when: manual
  tags:
    - docker
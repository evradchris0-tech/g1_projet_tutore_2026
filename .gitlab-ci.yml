# ==================== VARIABLES GLOBALES ====================
variables:
  NODE_ENV: test
  PORT_AUTH: "3001"
  PORT_GATEWAY: "3000"
  JWT_SECRET: test_jwt_secret_for_ci
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"
  
# ==================== WORKFLOW ====================
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

# ==================== CACHE STRATEGIES ====================
.cache_npm: &cache_npm
  key:
    files:
      - "**/package-lock.json"
  paths:
    - .npm
  policy: pull-push

# ==================== TEMPLATES ====================
.node_template: &node_template
  image: node:20-alpine
  tags:
    - backend
  before_script:
    - npm config set cache $NPM_CONFIG_CACHE --global

.service_template: &service_template
  <<: *node_template
  parallel:
    matrix:
      - SERVICE: ["api-gateway", "auth-service"]
  cache:
    <<: *cache_npm

# ==================== STAGES ====================
stages:
  - install
  - quality
  - security
  - test
  - build
  - deploy

# ==================== INSTALL ====================
install:
  <<: *service_template
  stage: install
  script:
    - cd $SERVICE
    - npm ci --prefer-offline --no-audit --cache $NPM_CONFIG_CACHE

# ==================== QUALITY ====================
lint:
  <<: *service_template
  stage: quality
  needs:
    - install
  script:
    - cd $SERVICE
    - npm ci --prefer-offline --no-audit --cache $NPM_CONFIG_CACHE
    - npm run lint
  allow_failure: false

format_check:
  <<: *service_template
  stage: quality
  needs:
    - install
  script:
    - cd $SERVICE
    - npm ci --prefer-offline --no-audit --cache $NPM_CONFIG_CACHE
    - npm run format:check || echo "Pas de script format:check"
  allow_failure: true

# ==================== SECURITY ====================
dependency_scan:
  <<: *service_template
  stage: security
  needs:
    - install
  script:
    - cd $SERVICE
    - npm ci --prefer-offline --no-audit --cache $NPM_CONFIG_CACHE
    - npm audit --audit-level=moderate || true
  allow_failure: true

secrets_detection:
  stage: security
  image: alpine:latest
  script:
    - apk add --no-cache git
    - git ls-files | grep -v "node_modules\|.npm" | xargs grep -iE "(password|secret|key|token)\s*[=:]" || true
  allow_failure: true
  needs: []

# ==================== TEST ====================
test:
  <<: *service_template
  stage: test
  needs:
    - install
  script:
    - cd $SERVICE
    - npm ci --prefer-offline --no-audit --cache $NPM_CONFIG_CACHE
    - npm run test:cov
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    paths:
      - $SERVICE/coverage/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: $SERVICE/coverage/cobertura-coverage.xml
    expire_in: 7d
    when: always

# ==================== BUILD ====================
build:
  <<: *service_template
  stage: build
  needs:
    - job: install
    - job: test
      artifacts: false
    - job: lint
      artifacts: false
  script:
    - cd $SERVICE
    - npm ci --prefer-offline --no-audit --cache $NPM_CONFIG_CACHE
    - npm run build
    - echo "Build version $(node -p "require('./package.json').version")"
  artifacts:
    paths:
      - $SERVICE/dist/
      - $SERVICE/package.json
      - $SERVICE/package-lock.json
    expire_in: 7d
  only:
    - develop
    - main
    - tags

# ==================== DEPLOY STAGING ====================
.deploy_template: &deploy_template
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client rsync
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H $STAGING_SERVER >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts

deploy_staging:
  <<: *deploy_template
  needs:
    - job: build
      artifacts: true
  script:
    - |
      # Fonction de déploiement pour un service
      deploy_service() {
        local service=$1
        echo "🚀 Déploiement de $service..."
        
        # Créer la structure de dossiers sur le serveur
        ssh $STAGING_USER@$STAGING_SERVER "mkdir -p /var/www/immo360-backend/$service/{dist,logs}"
        
        # Copier les fichiers buildés avec rsync (plus efficace que scp)
        rsync -avz --delete \
          $service/dist/ \
          $STAGING_USER@$STAGING_SERVER:/var/www/immo360-backend/$service/dist/
        
        # Copier package.json et package-lock.json
        rsync -avz \
          $service/package*.json \
          $STAGING_USER@$STAGING_SERVER:/var/www/immo360-backend/$service/
        
        echo "✅ $service déployé avec succès"
      }
      
      # Déployer les deux services
      deploy_service "api-gateway"
      deploy_service "auth-service"
      
      # Installer les dépendances de production et redémarrer sur le serveur
      ssh $STAGING_USER@$STAGING_SERVER "
        echo '📦 Installation des dépendances de production...'
        
        cd /var/www/immo360-backend/api-gateway
        npm ci --only=production --prefer-offline
        
        cd /var/www/immo360-backend/auth-service
        npm ci --only=production --prefer-offline
        
        echo '🔄 Redémarrage des services...'
        pm2 restart api-gateway --update-env || pm2 start dist/main.js --name api-gateway
        pm2 restart auth-service --update-env || pm2 start dist/main.js --name auth-service
        
        pm2 save
        
        echo '✨ Déploiement staging terminé avec succès !'
      "
  environment:
    name: staging
    url: https://staging-api.immo360.com
    deployment_tier: staging
    on_stop: stop_staging
  only:
    - develop
  when: manual

stop_staging:
  stage: deploy
  image: alpine:latest
  script:
    - echo "Arrêt de l'environnement staging"
  environment:
    name: staging
    action: stop
  when: manual
  only:
    - develop

# ==================== DEPLOY PRODUCTION ====================
deploy_production:
  <<: *deploy_template
  needs:
    - job: build
      artifacts: true
  script:
    - |
      deploy_service() {
        local service=$1
        echo "🚀 Déploiement PRODUCTION de $service..."
        
        ssh $PROD_USER@$PROD_SERVER "mkdir -p /var/www/immo360-backend/$service/{dist,logs,backup}"
        
        # Backup de l'ancienne version
        ssh $PROD_USER@$PROD_SERVER "
          if [ -d /var/www/immo360-backend/$service/dist ]; then
            cp -r /var/www/immo360-backend/$service/dist /var/www/immo360-backend/$service/backup/dist_\$(date +%Y%m%d_%H%M%S)
            echo '💾 Backup créé'
          fi
        "
        
        rsync -avz --delete \
          $service/dist/ \
          $PROD_USER@$PROD_SERVER:/var/www/immo360-backend/$service/dist/
        
        rsync -avz \
          $service/package*.json \
          $PROD_USER@$PROD_SERVER:/var/www/immo360-backend/$service/
        
        echo "✅ $service déployé avec succès"
      }
      
      deploy_service "api-gateway"
      deploy_service "auth-service"
      
      ssh $PROD_USER@$PROD_SERVER "
        cd /var/www/immo360-backend/api-gateway && npm ci --only=production
        cd /var/www/immo360-backend/auth-service && npm ci --only=production
        
        pm2 restart api-gateway --update-env
        pm2 restart auth-service --update-env
        pm2 save
        
        echo '✨ Déploiement PRODUCTION terminé !'
      "
  environment:
    name: production
    url: https://api.immo360.com
    deployment_tier: production
  only:
    - main
    - tags
  when: manual

# ==================== ROLLBACK ====================
rollback_staging:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H $STAGING_SERVER >> ~/.ssh/known_hosts
  script:
    - |
      ssh $STAGING_USER@$STAGING_SERVER "
        pm2 restart api-gateway auth-service
        echo '⏮️  Rollback effectué - Services redémarrés'
      "
  environment:
    name: staging
    action: rollback
  when: manual
  only:
    - develop

rollback_production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H $PROD_SERVER >> ~/.ssh/known_hosts
  script:
    - |
      ssh $PROD_USER@$PROD_SERVER "
        # Restaurer le dernier backup
        cd /var/www/immo360-backend/api-gateway
        LAST_BACKUP=\$(ls -t backup/ | head -1)
        if [ -n \"\$LAST_BACKUP\" ]; then
          rm -rf dist
          cp -r backup/\$LAST_BACKUP dist
          echo '💾 Backup restauré: \$LAST_BACKUP'
        fi
        
        cd /var/www/immo360-backend/auth-service
        LAST_BACKUP=\$(ls -t backup/ | head -1)
        if [ -n \"\$LAST_BACKUP\" ]; then
          rm -rf dist
          cp -r backup/\$LAST_BACKUP dist
          echo '💾 Backup restauré: \$LAST_BACKUP'
        fi
        
        pm2 restart api-gateway auth-service
        echo '⏮️  Rollback PRODUCTION effectué'
      "
  environment:
    name: production
    action: rollback
  when: manual
  only:
    - main
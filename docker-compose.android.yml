version: "3.8"

services:
  android-build:
    build:
      context: .
      dockerfile: Dockerfile.android
      args:
        - BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
        - VCS_REF=$(git rev-parse --short HEAD)
        - VERSION=1.0.0
        - BUILD_TYPE=release
    container_name: immo360-android-apk
    ports:
      - "8080:80"
    restart: unless-stopped
    networks:
      - immo360-network
    healthcheck:
      test:
        ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.immo360.service=android-build"
      - "com.immo360.version=1.0.0"
      - "com.immo360.platform=android"

networks:
  immo360-network:
    driver: bridge

# ==================== RENDER CONFIGURATION ====================
# Configuration multi-environnements pour Render.com

services:
  # ==================== PRODUCTION ====================
  - type: web
    name: g1-projet-tutore-frontend
    env: static
    branch: web
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: VITE_API_BASE_URL
        value: https://immo360-api-gateway.onrender.com/api
      - key: VITE_ENV
        value: production
    
    headers:
      # Cache pour les assets statiques
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      
      # Cache pour les images
      - path: /images/*
        name: Cache-Control
        value: public, max-age=86400
      
      # Pas de cache pour l'index
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      
      # Security headers
      - path: /*
        name: X-Frame-Options
        value: DENY
      
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
    
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ==================== STAGING ====================
  - type: web
    name: g1-projet-tutore-frontend-staging
    env: static
    branch: develop
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: VITE_API_BASE_URL
        value: https://immo360-api-gateway.onrender.com/api
      - key: VITE_ENV
        value: staging
    
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=3600
      
      - path: /index.html
        name: Cache-Control
        value: no-cache
      
      # Badge staging dans les headers
      - path: /*
        name: X-Environment
        value: staging
    
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
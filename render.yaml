services:
  # Auth Service avec PostgreSQL intégré
  - type: web
    name: immo360-auth-service
    runtime: node
    region: frankfurt
    plan: free
    repo: https://github.com/evradchris0-tech/g1_projet_tutore_2026
    branch: backend  # ← CHANGÉ de develop à backend
    rootDir: auth-service
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 5432
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_NAME
        sync: false
      - key: JWT_SECRET
        generateValue: true
    healthCheckPath: /

  # API Gateway
  - type: web
    name: immo360-api-gateway
    runtime: node
    region: frankfurt
    plan: free
    repo: https://github.com/evradchris0-tech/g1_projet_tutore_2026
    branch: backend  # ← CHANGÉ de develop à backend
    rootDir: api-gateway
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: AUTH_SERVICE_URL
        value: https://immo360-auth-service.onrender.com
    healthCheckPath: /

databases:
  - name: immo360-db
    databaseName: immo360_production
    user: immo360_user
    plan: free
    region: frankfurt